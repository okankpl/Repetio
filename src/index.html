<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Repetio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

      name="description"
      content="Karteikarten und Quizfragen mit Wiederholungsplan: eigene Fächer anlegen und offline lernen"
    />
    <!-- Farbe der Browser- bzw. Statusleiste, passend zum hellen und dunklen Design -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1216" />
    <!-- iPhone/iPad: Name und Darstellung, wenn die App zum Home-Bildschirm hinzugefügt wird -->
    <meta name="apple-mobile-web-app-title" content="Repetio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="icons/icon-96x96.png" />
    <!-- iOS rundet die Ecken selbst ab, braucht also ein Icon ohne transparente Ecken -->
    <link rel="apple-touch-icon" href="icons/maskable-512x512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
